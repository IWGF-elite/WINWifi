<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var origFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return origFetch;
                },
                set: function(val) {
                  origFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
